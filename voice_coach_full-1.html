<style>

ns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.008));padding:18px}.k{font-size:11px;font-weight:800;color:var(--a);letter-spacing:.02em}.muted{color:var(--muted)}h1{font-size:32px;line-height:1.1;letter-spacing:-.04em;margin:7px 0 12px}h2{font-size:20px;line-height:1.2;margin:0 0 9px}h3{font-size:14px;margin:13px 0 6px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.tag{border:1px solid var(--line);background:#111b2b;border-radius:999px;padding:4px 7px;font-size:10px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:10px}.btn:hover{background:var(--panel2)}.primary{background:#19335e;border-color:#315b9a}.danger{background:#3c1f26;border-color:#6c3640}.notice{border:1px solid #33445c;background:#111b2b;border-radius:12px;padding:11px 13px;margin:10px 0}.warn{border-color:#6c5829;background:#1c1910}.safe{border-color:#6c3640;background:#201318}.step{border-left:3px solid #38516f;padding:3px 0 3px 12px;margin:7px 0}.practice{background:#0b1726;border-color:#315675}.prompt{font-size:18px;font-weight:700;line-height:1.6;background:#0d1521;border:1px solid var(--line);padding:12px 14px;border-radius:12px}.recrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px}.recstate{font-size:11px;color:var(--muted)}.wave{height:84px;margin-top:10px;background:#08111b;border:1px solid var(--line);border-radius:11px}.analysis{display:none;margin-top:14px}.analysis.show{display:block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d1520}.metric .l{font-size:10px;color:var(--muted)}.metric .v{font-size:20px;font-weight:800}.metric .delta{font-size:10px}.up{color:var(--g)}.down{color:var(--w)}.chartbox{height:220px;border:1px solid var(--line);border-radius:12px;background:#09111b;padding:8px}.chartbox canvas{width:100%;height:100%}.list{display:grid;gap:8px}.rec{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#0d1520}.rtitle{font-size:12px;font-weight:700}.rmeta{font-size:10px;color:var(--muted)}.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{color:var(--muted)}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:#273247}.tl{position:relative;padding:0 0 16px 16px}.tl:before{content:"";position:absolute;left:-1px;top:5px;width:9px;height:9px;background:var(--a);border-radius:50%}.small{font-size:11px}.mob{display:none}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.progress{height:7px;background:#0c1320;border-radius:99px;overflow:hidden;border:1px solid var(--line)}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g));width:0}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:40;width:300px;left:0;top:0;transform:translateX(-102%);transition:.18s;box-shadow:20px 0 40px rgba(0,0,0,.35)}.side.open{transform:none}.mob{display:block}.hero,.grid2,.grid3,.metrics{grid-template-columns:1fr}.content{padding:20px 13px 50px}h1{font-size:28px}.top{padding:9px 11px}}</style></head><body>

<script>
const DATA=[{"title":"CHAPTER 0","subtitle":"Start Assessment","desc":"같은 문장을 같은 조건으로 기록해 출발 기준선을 만든다.","lessons":[{"id":"0-1","title":"시작 평가","focus":"baseline","practice":"6개 표준 샘플을 자연스럽게 녹음하고 피치·공명·발음·억양·음질·볼륨의 시작 상태를 저장한다.","prompt":"평서·질문·감탄·짧은 문장·긴 문장·자유 발화"}]},{"title":"CHAPTER 1","subtitle":"Voice Basics","desc":"호흡·발성·성도·조음·공명·억양·음질의 역할을 분리해 이해한다.","lessons":[{"id":"1-1","title":"How voice is produced","focus":"basics","practice":"호흡 에너지→성대 진동→성도 필터→혀·입술·턱의 조음 흐름을 소리로 관찰한다.","prompt":"안녕하세요."},{"id":"1-2","title":"What Pitch / F0 is","focus":"pitch","practice":"Hz와 F0 평균·범위·시간축 윤곽을 구분한다.","prompt":"아—"},{"id":"1-3","title":"What Resonance is","focus":"resonance","practice":"Pitch와 별개로 성도 모양이 스펙트럼에 미치는 영향을 본다.","prompt":"아—"},{"id":"1-4","title":"Articulation / Pronunciation","focus":"articulation","practice":"혀·입술·턱과 모음·자음의 역할을 관찰한다.","prompt":"가나다라 마바사"},{"id":"1-5","title":"Intonation","focus":"intonation","practice":"문장 안의 F0 흐름과 평서·질문 차이를 관찰한다.","prompt":"오늘 학교에 가요?"},{"id":"1-6","title":"Voice Quality & Safe Voice Use","focus":"quality","practice":"거칠기·숨섞임·긴장감과 편안한 반복 가능성을 함께 관찰한다.","prompt":"안녕하세요."}]},{"title":"CHAPTER 2","subtitle":"Pitch","desc":"무조건 높이기 대신 측정→탐색→안정화→말속 전이로 피치를 훈련한다.","lessons":[{"id":"2-1","title":"Understand F0","focus":"pitch","practice":"습관적 말높이의 평균·중앙값·범위를 측정한다.","prompt":"안녕하세요. 오늘은 목소리 연습을 해볼게요."},{"id":"2-2","title":"Measure Habitual Pitch","focus":"pitch","practice":"같은 문장을 3회 녹음해 대표적인 습관적 F0를 본다.","prompt":"안녕하세요. 오늘은 목소리 연습을 해볼게요."},{"id":"2-3","title":"What Changes When Pitch Changes","focus":"pitch","practice":"편안한 기준음과 약간 높은 음을 비교해 F0와 음질의 동시 변화를 본다.","prompt":"안녕하세요."},{"id":"2-4","title":"Explore Comfortable Higher Pitch","focus":"pitch","practice":"힘을 추가하지 않는 범위에서 더 높은 말 시작점을 탐색한다.","prompt":"안녕하세요."},{"id":"2-5","title":"Sustain a Pitch Stably","focus":"pitch","practice":"2~3초 유지→짧은 문장으로 연결하면서 안정성을 본다.","prompt":"아—"},{"id":"2-6","title":"Pitch at Syllable Level","focus":"pitch","practice":"한 음절 안의 시작·중간·끝 F0 변화를 관찰한다.","prompt":"안—녕—"},{"id":"2-7","title":"Pitch at Word Level","focus":"pitch","practice":"단어 안 특정 음절의 높낮이 위치를 관찰한다.","prompt":"오늘 학교"},{"id":"2-8","title":"Pitch at Sentence Level","focus":"pitch","practice":"문장 전체 시작·중간·끝의 F0 contour를 확인한다.","prompt":"오늘 학교에 가요."},{"id":"2-9","title":"Transfer to Natural Speech","focus":"pitch","practice":"준비 문장과 20초 자유 발화를 비교한다.","prompt":"오늘 있었던 일을 편하게 말해 보세요."}]},{"title":"CHAPTER 3","subtitle":"Pitch Stabilization","desc":"짧은 소리에서 자발화까지 단계적으로 피치 조절을 전이한다.","lessons":[{"id":"3-1","title":"Sound → Syllable","focus":"pitch","practice":"짧은 소리를 음절로 연결하고 변동을 비교한다.","prompt":"안—"},{"id":"3-2","title":"Syllable → Word","focus":"pitch","practice":"단어 안에서 시작·끝 F0 흐름을 유지한다.","prompt":"오늘"},{"id":"3-3","title":"Word → Short Sentence","focus":"pitch","practice":"3~5어절 문장으로 확장한다.","prompt":"오늘은 괜찮아."},{"id":"3-4","title":"Short → Long Sentence","focus":"pitch","practice":"의미 단위로 나눴다가 긴 문장으로 연결한다.","prompt":"오늘은 천천히 말하면서 소리의 변화를 하나씩 확인해 볼게요."},{"id":"3-5","title":"Long Sentence → Spontaneous Speech","focus":"pitch","practice":"20~30초 자발화에서 변화가 유지되는지 본다.","prompt":"최근 있었던 일을 편하게 말해 보세요."}]},{"title":"CHAPTER 4","subtitle":"Resonance","desc":"혀·입술·턱·모음·성도 모양과 formant 변화를 단계적으로 연결한다.","lessons":[{"id":"4-1","title":"Resonance vs Pitch","focus":"resonance","practice":"같은 F0에서도 공명 관련 스펙트럼이 달라질 수 있음을 비교한다.","prompt":"아—"},{"id":"4-2","title":"Vocal Tract Shape","focus":"resonance","practice":"턱·입술·혀의 작은 변화와 공명 변화를 탐색한다.","prompt":"이— 우—"},{"id":"4-3","title":"Tongue / Lips / Jaw","focus":"resonance","practice":"대표 모음에서 조음기 움직임을 분리해 연습한다.","prompt":"아— 이— 우—"},{"id":"4-4","title":"Vowels: ㅏ ㅔ ㅣ ㅗ ㅜ","focus":"resonance","practice":"5모음의 F1/F2/F3 추정 패턴을 비교한다.","prompt":"아 에 이 오 우"},{"id":"4-5","title":"Vowels → Words → Sentences → Spontaneous","focus":"resonance","practice":"모음 기반 변화를 단어·문장·자발화로 전이한다.","prompt":"오늘 이 오디오를 들어 볼게요."}]},{"title":"CHAPTER 5","subtitle":"Articulation / Pronunciation","desc":"모음·자음·혀·입술·턱 협응과 명료도를 단계적으로 다룬다.","lessons":[{"id":"5-1","title":"Vowels","focus":"articulation","practice":"모음의 위치와 전환을 또렷하게 구분한다.","prompt":"아 에 이 오 우"},{"id":"5-2","title":"Consonants","focus":"articulation","practice":"파열음·마찰음 등 자음의 접촉과 스펙트럼 변화를 관찰한다.","prompt":"가다라 마바사"},{"id":"5-3","title":"Tongue / Lips / Jaw Coordination","focus":"articulation","practice":"느린 속도→중간→자연 속도로 조음 협응을 연습한다.","prompt":"가나다라 마바사"},{"id":"5-4","title":"Clarity","focus":"articulation","practice":"속도·음절 경계·끝소리를 조절해 명료도를 관찰한다.","prompt":"괜찮아. 천천히 해도 돼."},{"id":"5-5","title":"Word → Sentence → Natural Speech","focus":"articulation","practice":"단어→문장→20초 자연 발화로 전이한다.","prompt":"오늘 있었던 일을 편하게 말해 보세요."}]},{"title":"CHAPTER 6","subtitle":"Intonation","desc":"피치 범위·변화·문장 끝·문장 유형·감정을 실제 contour로 다룬다.","lessons":[{"id":"6-1","title":"Pitch Range & Variation","focus":"intonation","practice":"평서와 질문의 F0 변화폭과 윤곽을 비교한다.","prompt":"오늘 가요?"},{"id":"6-2","title":"Sentence-Final Movement","focus":"intonation","practice":"문장 마지막 30%의 움직임을 따로 관찰한다.","prompt":"괜찮아?"},{"id":"6-3","title":"Declarative / Question / Exclamation","focus":"intonation","practice":"평서·질문·감탄의 contour 차이를 비교한다.","prompt":"정말 잘 됐다!"},{"id":"6-4","title":"Emotion","focus":"intonation","practice":"차분함·놀람·기쁨 등 상황별 자연스러운 변화폭을 탐색한다.","prompt":"정말?"}]},{"title":"CHAPTER 7","subtitle":"Voice Quality","desc":"CPP-like·HNR·jitter·shimmer·spectral tilt를 편안함과 함께 본다.","lessons":[{"id":"7-1","title":"CPP","focus":"quality","practice":"짧은 모음과 문장에서 cepstral peak 참고값을 비교한다.","prompt":"아—"},{"id":"7-2","title":"HNR / Jitter / Shimmer","focus":"quality","practice":"주기성·주기 변동·진폭 변동을 함께 관찰한다.","prompt":"안녕하세요."},{"id":"7-3","title":"Breathiness / Strain","focus":"quality","practice":"숨섞임이나 긴장감을 목표화하지 않고 변화만 관찰한다.","prompt":"안녕하세요."},{"id":"7-4","title":"Comfort & Repetition","focus":"quality","practice":"같은 문장을 반복하고 초반/후반 음질 변화를 확인한다.","prompt":"안녕하세요."}]},{"title":"CHAPTER 8","subtitle":"Loudness","desc":"조용함이 아니라 상황에 맞는 크기와 음질의 균형을 연습한다.","lessons":[{"id":"8-1","title":"Quiet Context","focus":"loudness","practice":"조용한 장소의 편안한 크기와 상대 RMS를 기록한다.","prompt":"괜찮아."},{"id":"8-2","title":"Normal / Louder Context","focus":"loudness","practice":"보통·약간 큰 환경을 구분해 볼륨 변화를 관찰한다.","prompt":"여기서 들려요?"},{"id":"8-3","title":"Situation-Appropriate Loudness","focus":"loudness","practice":"친구·전화·원거리 상황별 적정 크기를 비교한다.","prompt":"잘 들려?"}]},{"title":"CHAPTER 9","subtitle":"Connected Speech","desc":"Pitch + Resonance + Articulation + Intonation + Voice Quality + Loudness를 단계적으로 통합한다.","lessons":[{"id":"9-1","title":"Pitch + Resonance","focus":"integration","practice":"두 요소를 각각→결합 순서로 적용한다.","prompt":"오늘은 천천히 말해 볼게요."},{"id":"9-2","title":"Add Articulation","focus":"integration","practice":"피치·공명에 조음 명료도를 추가한다.","prompt":"오늘 정말 괜찮아."},{"id":"9-3","title":"Add Intonation","focus":"integration","practice":"세 요소에 문장 억양을 추가한다.","prompt":"정말 잘 됐다!"},{"id":"9-4","title":"Add Voice Quality + Loudness","focus":"integration","practice":"음질과 볼륨까지 포함해 짧은 문장을 관리한다.","prompt":"안녕하세요. 오늘은 괜찮아요."},{"id":"9-5","title":"Full Connected Speech","focus":"integration","practice":"준비 문장과 자유 발화를 모두 통합해 비교한다.","prompt":"지금 생각나는 이야기를 편하게 말해 보세요."}]},{"title":"CHAPTER 10","subtitle":"Real Conversation","desc":"실전 상황에서 자동화·전이 여부를 확인한다.","lessons":[{"id":"10-1","title":"Friend Conversation","focus":"conversation","practice":"친한 사람에게 말하듯 20~30초 말한다.","prompt":"오늘 뭐 했어?"},{"id":"10-2","title":"Stranger / First Meeting","focus":"conversation","practice":"처음 만난 사람에게 자기소개하는 상황을 연습한다.","prompt":"안녕하세요. 저는 오늘 처음 왔어요."},{"id":"10-3","title":"Phone","focus":"conversation","practice":"시각 정보 없이 음성만 사용하는 상황을 연습한다.","prompt":"여보세요? 안녕하세요."},{"id":"10-4","title":"Surprise / Laughter / Emotion","focus":"conversation","practice":"갑작스러운 반응·웃음·감정에서 학습 요소가 어떻게 변하는지 본다.","prompt":"어? 진짜?"},{"id":"10-5","title":"Long Speech","focus":"conversation","practice":"1~2분 긴 발화의 전반/후반 차이를 본다.","prompt":"최근 관심 있는 주제를 1~2분 말해 보세요."},{"id":"10-6","title":"Spontaneous Speech Test","focus":"conversation","practice":"준비 없이 30~60초 자유롭게 말해 전체 시스템을 테스트한다.","prompt":"화면의 랜덤 질문에 30초 답해 보세요."}]},{"title":"CHAPTER 11","subtitle":"Final Assessment","desc":"CHAPTER 0과 같은 샘플을 다시 기록해 Start ↔ Final 변화를 확인한다.","lessons":[{"id":"11-1","title":"Final Assessment","focus":"final","practice":"시작 평가와 동일한 6개 샘플을 기록하고 전체 여정을 마무리한다.","prompt":"CHAPTER 0의 6개 샘플"}]}];

const labels={pitch:'Pitch',resonance:'Resonance',articulation:'Articulation',intonation:'Intonation',quality:'Voice Quality',loudness:'Loudness',basics:'Voice Basics',integration:'Connected Speech',conversation:'Real Conversation',final:'Final Assessment'};
function $(s){return document.querySelector(s)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function done(ci,li){return localStorage.getItem(`vcd_${ci}_${li}`)==='1'}function setDone(ci,li,v){v?localStorage.setItem(`vcd_${ci}_${li}`,'1'):localStorage.removeItem(`vcd_${ci}_${li}`)}

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('recs',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let tx=db.transaction('recs','readwrite');tx.objectStore('recs').put(x);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function allRecs(){return new Promise((res,rej)=>{let tx=db.transaction('recs');let r=tx.objectStore('recs').getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.ts-a.ts));r.onerror=()=>rej(r.error)})}
function getRec(id){return new Promise((res,rej)=>{let r=db.transaction('recs').objectStore('recs').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function delRec(id){return new Promise((res,rej)=>{let tx=db.transaction('recs','readwrite');tx.objectStore('recs').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function fmtDate(x){return new Date(x).toLocaleString('ko-KR',{hour12:false})}function sec(s){return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')}

function focusInfo(f){let s={title:'',steps:[],mechanism:'',acoustic:'',hear:'',safety:'높은 음이나 특정 자세를 힘으로 유지하지 않는다. 통증·심한 피로·지속적인 쉰 목소리가 있으면 중단한다.'};switch(f){case'pitch':s.title='Pitch / F0';s.steps=['편안한 기준 소리를 먼저 기록한다.','조금씩 변화시키고 목에 힘이 늘지 않는지 확인한다.','소리→음절→단어→문장→자발화 순서로 전이한다.'];s.mechanism='성대 진동의 기본 주파수 변화가 F0에 직접 반영되며, 실제 발화에서는 호흡·조음·억양과 함께 움직인다.';s.acoustic='평균/중앙 F0, 최저·최고 F0, 범위, 표준편차, 시간축 F0 contour.';s.hear='단순히 높아지는가가 아니라, 원하는 높이에서 편안하고 반복 가능한가를 듣는다.';break;case'resonance':s.title='Resonance / Formants';s.steps=['혀·입술·턱의 움직임을 작게 탐색한다.','대표 모음에서 변화를 비교한다.','단어→문장→자발화로 전이한다.'];s.mechanism='성도 형태가 성대 신호를 필터링해 formant와 스펙트럼 에너지 분포를 바꾼다.';s.acoustic='F1/F2/F3는 브라우저에서 추정값으로 표시하며 실제 formant 분석과 동일하지 않다.';s.hear='Pitch가 비슷해도 음색과 공명감이 달라지는지 확인한다.';break;case'articulation':s.title='Articulation / Pronunciation';s.steps=['모음과 자음을 분리해 관찰한다.','혀·입술·턱 협응을 느린 속도에서 시작한다.','자연 속도로 연결한다.'];s.mechanism='조음 위치·접촉·마찰·타이밍이 말소리의 스펙트럼과 시간 구조를 바꾼다.';s.acoustic='F1/F2 변화폭, voiced ratio, zero-crossing·spectral flux 같은 참고값.';s.hear='또렷함을 크게 말하는 것과 동일시하지 않고, 자연스러운 속도에서 구별되는 소리를 듣는다.';break;case'intonation':s.title='Intonation';s.steps=['문장 종류를 바꿔 본다.','시작·중간·끝의 F0 움직임을 관찰한다.','감정을 넣고 과장을 줄인다.'];s.mechanism='시간에 따른 F0 변화가 문장 구조와 표현의 중요한 단서가 된다.';s.acoustic='F0 range, 표준편차, contour, 문장 마지막 구간의 변화량.';s.hear='같은 평균 F0여도 문장 윤곽이 달라지는지 확인한다.';break;case'quality':s.title='Voice Quality';s.steps=['자연 음질을 먼저 기록한다.','반복 녹음에서 편안함과 피로를 확인한다.','숨섞임·거칠기·긴장감을 목표 자체로 고정하지 않는다.'];s.mechanism='성문 압박·공기 누출·주기 안정성 등의 변화가 음질의 스펙트럼과 주기성에 반영된다.';s.acoustic='CPP-like, HNR, jitter, shimmer, spectral tilt를 자기비교용으로 표시.';s.hear='한 번 예쁜 소리보다 여러 번 편안하게 낼 수 있는지 듣는다.';break;case'loudness':s.title='Loudness';s.steps=['편안한 보통 크기부터 시작한다.','조용한·보통·약간 큰 상황을 구분한다.','큰 소리에서 음질이 같이 바뀌는지 확인한다.'];s.mechanism='발성 노력·호흡·환경·마이크 거리가 상대 음량에 함께 영향을 준다.';s.acoustic='RMS dBFS와 변동량. 마이크 입력 의존이며 실제 dB SPL과 동일하지 않다.';s.hear='조용함이 아니라 상황에 맞는 전달 가능한 크기를 찾는다.';break;case'integration':s.title='통합 발화';s.steps=['요소를 하나씩 추가한다.','각 단계의 변화를 저장한다.','마지막에 자유 발화로 전이한다.'];s.mechanism='여러 요소가 동시에 움직이는 실제 말하기에서는 한 요소의 변화가 다른 요소에도 영향을 줄 수 있다.';s.acoustic='Pitch·formant-like·articulation proxy·intonation·quality·RMS를 동시에 비교.';s.hear='특정 숫자가 높아졌는지보다 전체가 자연스럽고 반복 가능한지 듣는다.';break;case'conversation':s.title='실전 전이';s.steps=['상황을 정한다.','내용에 집중하면서 자연스럽게 말한다.','연습 기록과 비교한다.'];s.mechanism='주의가 내용으로 이동하면 자동화되지 않은 조절이 습관으로 돌아갈 수 있다.';s.acoustic='전체 프로필과 발화 후반부 변화까지 비교.';s.hear='연습 문장에서 되던 요소가 실제 말에서도 유지되는지 확인한다.';break;case'basics':s.title='Voice Basics';s.steps=['호흡→발성→성도→조음의 흐름을 이해한다.','Pitch와 resonance를 분리한다.','편안함을 모든 연습의 기준으로 삼는다.'];s.mechanism='음성은 단일 변수의 결과가 아니라 source-filter-articulation이 연결된 시스템이다.';s.acoustic='이후 분석에서 F0·formant-like·quality·loudness·articulation 지표를 함께 본다.';s.hear='하나의 숫자 대신 소리가 어떤 층위에서 변했는지 듣는다.';break;case'baseline':s.title='Start Assessment';s.steps=['같은 마이크·거리·장소를 유지한다.','6개 표준 샘플을 자연스럽게 기록한다.','편안함과 개인적인 느낌을 함께 메모한다.'];s.mechanism='동일한 자극을 반복 기록하면 자기 내부 변화의 비교가 쉬워진다.';s.acoustic='Pitch·Resonance·Articulation·Intonation·Quality·Loudness 전체 기준선.';s.hear='평가 등급이 아니라 출발점이다.';break;case'final':s.title='Final Assessment';s.steps=['CHAPTER 0과 같은 조건을 맞춘다.','같은 6개 샘플을 기록한다.','Start ↔ Final을 비교한다.'];s.mechanism='같은 자극의 전후 비교로 개인 내부의 변화를 확인한다.';s.acoustic='시작과 최종의 전체 프로필과 주요 delta.';s.hear='무엇이 얼마나 변했고 무엇은 그대로인지 확인한다.';break}return s}

async function prevAnalysis(ts){let rs=await allRecs();let x=rs.filter(r=>r.ci===state.ci&&r.li===state.li&&r.ts<ts);return x[0]?.analysis||null}
function mc(name,v,note,p,field){let de=p?delta(v,p[field]):null;return `<div class="metric"><div class="l">${name}</div><div class="v">${v}</div>${de?`<div class="delta ${de.cls}">이전 대비 ${de.txt}</div>`:''}<div class="l" style="margin-top:3px">${note}</div></div>`}
async function showAnalysis(r){let a=r.analysis,p=await prevAnalysis(r.ts);let band=a.f0Mean==null?'유효 F0 부족':(a.f0Mean>=165&&a.f0Mean<=255?'성인 여성 화자 연구 참고대역 안':(a.f0Mean>=145&&a.f0Mean<165?'참고대역 바로 아래 · 겹침 가능':a.f0Mean>255&&a.f0Mean<=285?'참고대역 위 · 개인차 가능':'참고대역 밖'));$('#analysis').classList.add('show');$('#metrics').innerHTML=[mc('Mean F0',a.f0Mean?Math.round(a.f0Mean)+' Hz':'—',`평균 기본주파수 · ${band}`,p,'f0Mean'),mc('F0 range',a.f0Range?Math.round(a.f0Range)+' Hz':'—','최저~최고 F0',p,'f0Range'),mc('F2 추정',a.f2?Math.round(a.f2)+' Hz':'—','공명 관련 추정치',p,'f2'),mc('F1 추정',a.f1?Math.round(a.f1)+' Hz':'—','공명 관련 추정치',p,'f1'),mc('Final ΔF0',a.f0FinalDelta!=null?num(a.f0FinalDelta)+' Hz':'—','앞 20%→뒤 20%',p,'f0FinalDelta'),mc('RMS',a.rmsDbfs!=null?num(a.rmsDbfs)+' dBFS':'—','상대 입력 레벨',p,'rmsDbfs'),mc('HNR',a.quality.hnr!=null?num(a.quality.hnr)+' dB':'—','주기성 참고치',p,'quality.hnr'),mc('Jitter',a.quality.jitter!=null?num(a.quality.jitter)+' %':'—','주기 변동 참고치',p,'quality.jitter'),mc('Shimmer',a.quality.shimmer!=null?num(a.quality.shimmer)+' %':'—','진폭 변동 참고치',p,'quality.shimmer'),mc('CPP-like',num(a.quality.cppLike),'cepstral peak 참고치',p,'quality.cppLike'),mc('Voiced ratio',(a.voicedRatio*100).toFixed(1)+' %','유효 F0 프레임 비율',p,'voicedRatio'),mc('Spectral tilt',a.quality.spectralTilt!=null?num(a.quality.spectralTilt):'—','스펙트럼 기울기 참고치',p,'quality.spectralTilt')].join('');drawLine($('#pitchchart'),a.contour);drawSpec($('#specchart'),a.spectrum);$('#feedback').innerHTML=`<tr><th>자기 비교</th><td>${p?'이전 기록과 비교값을 확인했다.':'첫 기록이라 이전 비교값이 없다.'}</td></tr><tr><th>공명</th><td>F1/F2/F3는 이 브라우저에서 계산하는 <b>추정값</b>이다. 실제 formant 분석용 장비·전문 소프트웨어와 동일한 정확도를 뜻하지 않는다.</td></tr><tr><th>발음</th><td>이 프로토타입은 발음 정답 여부를 판정하지 않는다. articulation proxy를 자기비교 자료로만 사용한다.</td></tr><tr><th>다음 판단</th><td>숫자 + 녹음 재생 + 편안함을 같이 보고, 어떤 요소가 가장 많이 변했는지 스스로 한 문장으로 적는다.</td></tr>`;state.recId=r.id;$('#play').disabled=false}
async function refreshRecords(){let rs=(await allRecs()).filter(r=>r.ci===state.ci&&r.li===state.li);$('#records').innerHTML=rs.length?rs.map(r=>`<div class="rec"><div><div class="rtitle">${fmtDate(r.ts)}</div><div class="rmeta">${sec(r.analysis.duration)} · F0 ${r.analysis.f0Mean?Math.round(r.analysis.f0Mean)+' Hz':'—'} · RMS ${r.analysis.rmsDbfs!=null?r.analysis.rmsDbfs.toFixed(1)+' dBFS':'—'}</div></div><div class="recrow"><button class="btn" onclick="playId('${r.id}')">▶</button><button class="btn danger" onclick="removeId('${r.id}')">삭제</button></div></div>`).join(''):'<div class="empty">아직 녹음 기록이 없다.</div>'}
async function playId(id){let r=await getRec(id);playBlob(r.blob)}async function removeId(id){if(confirm('이 녹음 기록을 삭제할까요?')){await delRec(id);refreshRecords()}}
async function renderJourney(){let rs=await allRecs();let start=rs.filter(r=>r.ci===0&&r.li===0).sort((a,b)=>a.ts-b.ts)[0],final=rs.filter(r=>r.ci===11&&r.li===0).sort((a,b)=>b.ts-a.ts)[0];return `<div class="card"><div class="k">🎙 VOICE JOURNEY</div><h1>처음 → 현재</h1><p class="muted">모든 연습 기록을 시간순으로 다시 듣고, Start ↔ Final 변화를 확인한다.</p>${rs.length?`<div class="timeline">${rs.map(r=>{let l=DATA[r.ci].lessons[r.li];return `<div class="tl"><b>${esc(DATA[r.ci].title)} · ${esc(l.title)}</b><div class="small muted">${fmtDate(r.ts)} · ${sec(r.analysis.duration)} · F0 ${r.analysis.f0Mean?Math.round(r.analysis.f0Mean):'—'} Hz</div><button class="btn" onclick="playId('${r.id}')">▶ 재생</button><button class="btn" onclick="lesson(${r.ci},${r.li})">레슨 열기</button></div>`}).join('')}</div>`:'<div class="empty">아직 녹음이 없다. CHAPTER 0에서 시작한다.</div>'}</div><div class="card" style="margin-top:14px"><div class="k">START ↔ FINAL</div><h2>전체 변화</h2><div id="sf">${start&&final?`<div class="grid3">${metric('Mean F0',`${start.analysis.f0Mean?Math.round(start.analysis.f0Mean):'—'} → ${final.analysis.f0Mean?Math.round(final.analysis.f0Mean):'—'} Hz`,'Start → Final',null,'f0Mean')}${metric('F2 추정',`${start.analysis.f2?Math.round(start.analysis.f2):'—'} → ${final.analysis.f2?Math.round(final.analysis.f2):'—'} Hz`,'Start → Final',null,'f2')}${metric('RMS',`${start.analysis.rmsDbfs!=null?start.analysis.rmsDbfs.toFixed(1):'—'} → ${final.analysis.rmsDbfs!=null?final.analysis.rmsDbfs.toFixed(1):'—'} dBFS`,'Start → Final',null,'rmsDbfs')}</div>`:'<div class="empty">CHAPTER 0 시작 평가와 CHAPTER 11 최종 평가가 모두 필요하다.</div>'}</div></div>`}
function renderRefs(){return `<div class="card"><div class="k">REFERENCE</div><h1>여자 목소리 학습의 기준</h1><p>이 앱은 pitch만 올리는 단일 훈련이 아니라 pitch, resonance, articulation, intonation, voice quality, loudness를 단계적으로 다룬다.</p><p><b>Pitch 참고범위</b><br>성인 여성 화자의 말하기 F0는 문헌에서 약 165–255 Hz의 넓은 참고대역으로 자주 제시된다. 이 범위는 집단 참고값이며 절대적인 성별 판정선은 아니다.</p><p><b>Pitch만으로 충분하지 않은 이유</b><br>ASHA는 gender-affirming voice/communication에서 pitch, intonation, voice quality, resonance, articulation, loudness 등을 함께 평가·훈련 영역으로 제시한다. 또한 pitch modification alone은 충분하지 않을 수 있다고 설명한다.</p><p><b>분리 학습 + 통합</b><br>Leyns et al. (2023)의 무작위대조연구는 transgender women을 대상으로 pitch elevation training과 articulation-resonance training을 별도 블록으로 시행한 뒤 결합했다. pitch 훈련 후 F0가 더 크게 증가했고, 결합 훈련에서는 formant와 vowel space 변화가 더 나타났다. 따라서 요소별 연습으로 조절 능력을 만들고, 이후 실제 말하기에서 통합하는 현재 구조가 합리적이다.</p><p><b>억양</b><br>더 여성적인 목소리를 목표로 한 2025년 무작위 임상시험에서도 4주 intonation training 후 여러 acoustic intonation 지표와 F0 값이 증가하고 청취자 평가가 변화했다. 즉 억양을 별도 훈련 대상으로 두는 근거도 있다.</p><div class="notice warn">이 앱의 기준은 ‘여성 점수’가 아니다. Pitch는 연구 참고대역을 방향으로 보여주고, 나머지 요소는 고정 컷오프보다 본인 기록의 변화와 실제 청취를 중심으로 본다.</div><p class="small muted"><b>주요 출처</b><br><a href="https://www.asha.org/practice-portal/professional-issues/gender-affirming-voice-and-communication/" target="_blank" rel="noopener">ASHA · Gender Affirming Voice and Communication</a><br><a href="https://pubmed.ncbi.nlm.nih.gov/36455242/" target="_blank" rel="noopener">Leyns et al., 2023 · Randomized Controlled Trial</a><br><a href="https://pubs.asha.org/doi/10.1044/2024_JSLHR-24-00563" target="_blank" rel="noopener">Intonation Training RCT · JSLHR</a></p><div class="notice safe">훈련 중 통증, 심한 피로, 지속적인 쉰 목소리 등이 나타나면 중단한다. 이 앱의 음향 분석은 교육·자기비교용이며 의료 진단을 대신하지 않는다.</div></div>`}
function renderSettings(){return `<div class="card"><div class="k">DATA</div><h1>기록 / 백업</h1><p class="muted">녹음은 현재 브라우저 IndexedDB에 저장된다.</p><button class="btn" onclick="exportJson()">JSON 기록 내보내기</button> <button class="btn danger" onclick="resetProgress()">진행률 초기화</button><div class="notice warn" style="margin-top:12px">JSON에는 분석 결과와 메타데이터가 들어가며 오디오 Blob은 포함하지 않는다. 중요한 오디오는 개별 브라우저 기능으로 별도 보관하는 것이 좋다.</div><div class="card" style="margin-top:12px"><b>마이크 실행 조건</b><br>HTTPS 또는 localhost 환경에서 실행하는 것이 가장 안정적이다. file://에서는 브라우저 정책에 따라 마이크가 제한될 수 있다.</div></div>`}
async function exportJson(){let rs=await allRecs();let clean=rs.map(r=>({id:r.id,ci:r.ci,li:r.li,ts:r.ts,analysis:r.analysis})),blob=new Blob([JSON.stringify({version:'1.0-full',exportedAt:Date.now(),completed:DATA.flatMap((c,ci)=>c.lessons.map((_,li)=>done(ci,li)?[ci,li]:null)).filter(Boolean),recordings:clean},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='voice-coach-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function resetProgress(){if(confirm('완료 표시만 초기화할까요? 녹음은 삭제되지 않습니다.')){DATA.forEach((c,ci)=>c.lessons.forEach((_,li)=>setDone(ci,li,false)));render()}}
function bindLesson(){let r=$('#rec'),s=$('#stop'),p=$('#play');r.onclick=startRec;s.onclick=stopRec;p.onclick=async()=>{if(state.recId){let x=await getRec(state.recId);playBlob(x.blob)}};refreshRecords()}
async function render(){nav();let c=$('#content');if(state.view==='home')c.innerHTML=renderHome();else if(state.view==='lesson'){c.innerHTML=renderLesson();$('#crumb').textContent=`${DATA[state.ci].title} / ${DATA[state.ci].lessons[state.li].title}`;bindLesson()}else if(state.view==='journey'){c.innerHTML=await renderJourney();$('#crumb').textContent='Voice Journey'}else if(state.view==='references'){c.innerHTML=renderRefs();$('#crumb').textContent='참고 자료'}else if(state.view==='settings'){c.innerHTML=renderSettings();$('#crumb').textContent='기록 / 백업'}}
openDB().then(render).catch(e=>{alert('IndexedDB 초기화에 실패했습니다. 브라우저 저장소 설정을 확인하세요.');console.error(e)});
</script></body></html>
